name: yak-allim

services:
  # OCR 분석 및 작업 자동화 엔진
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: yak-allim-n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - "${N8N_DATA_PATH:-C:/n8n_data}:/home/node/.n8n"
    networks:
      - app-network

  # 통합 CI/CD 빌드 및 배포 제어기
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: yak-allim-jenkins:latest
    container_name: yak-allim-jenkins
    user: root
    restart: always
    ports:
      - "9090:8080"
      - "50000:50000"
    environment:
      - ANDROID_HOME=/opt/android-sdk
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_android_sdk:/opt/android-sdk
      - "${DEPLOY_DIR:-C:/yakallim-deploy}:/var/jenkins_home/deploy"
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

# 서비스 간 격리 가상 네트워크
networks:
  app-network:
    name: app-network
    driver: bridge

# 영속성 상태 관리 데이터 스토리지
volumes:
  jenkins_home:
    external: true
  jenkins_android_sdk:
